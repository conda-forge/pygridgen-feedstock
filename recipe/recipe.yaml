schema_version: 1

context:
  version: "0.3.0"

package:
  name: pygridgen
  version: ${{ version }}

source:
  url: https://github.com/pygridgen/pygridgen/archive/v${{ version }}.tar.gz
  sha256: a38903708ec673ae3dc0b13cb8631ae57c7877a28967f803976a758a96b491fb
  patches:
    # Upstream only looks for libgridgen and libcsa in <prefix>/lib, but conda
    # installs Windows DLLs into <prefix>/Library/bin (e.g. csa.dll).
    - patches/find-windows-dlls.patch

build:
  number: 3
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - numpy
    - setuptools <80
  run:
    - python >=${{ python_min }}
    - gridgen
    - matplotlib-base
    - pyproj
    # Needs pkg_resources.
    - setuptools <80

tests:
  - python:
      imports: pygridgen
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
    script:
      - pytest --pyargs pygridgen

about:
  homepage: https://pygridgen.readthedocs.io/
  license:  MIT
  license_file: LICENSE.txt
  summary: Python interface to gridgen by Pavel Sakov

extra:
  recipe-maintainers:
    - ocefpaf
    - phobson
